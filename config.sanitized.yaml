# ============================================================
# Hermes server config (SANITIZED) - MultiAgency.ai
# ------------------------------------------------------------
# Copy to ~/.hermes/config.yaml on the server and fill in the
# real values marked <FILL>. NEVER commit the real config.
#
# Sensitive values redacted here:
#   - Tailscale IP        -> <TAILSCALE_IP>
#   - multi_user_basic secret -> <GENERATED_SECRET>
#   - password hashes     -> <HASH_ME_WITH_HASH_PASSWORD>
#   - Slack channel IDs   -> <SLACK_CHAT_ID>
# ============================================================

model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions

database:
  journal_mode: wal

agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.

terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300

web:
  backend: firecrawl
  use_gateway: false

browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false

compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  idle_compact_after_seconds: 0

prompt_caching:
  cache_ttl: 5m

display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all

tts:
  use_gateway: false

stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

delegation:
  max_iterations: 50

skills:
  creation_nudge_interval: 15

code_execution:
  timeout: 300
  max_tool_calls: 50

streaming:
  enabled: false

telemetry:
  shared_metrics:
    enabled: false

updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash

proxy:
  enabled: true

_config_version: 34

session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

# ---------------------------
# Gateway (desktop remote backend)
# ---------------------------
gateway:
  multiplex_profiles: true
  host: <TAILSCALE_IP>
  port: 9090
  url: http://<TAILSCALE_IP>:9090

platforms:
  slack:
    enabled: true
    home_channel:
      platform: slack
      chat_id: <SLACK_CHAT_ID>
      name: admin-dm

# ---------------------------
# Per-user dashboard auth (multi_user_basic plugin)
# ---------------------------
# Add one block per team member. Generate the password hash with:
#   python3 -c "from plugins.dashboard_auth.multi_user_basic import hash_password; print(hash_password('their-password'))"
dashboard:
  multi_user_basic:
    # Generate once and keep stable (base64 or hex, >= 32 bytes):
    #   python3 -c "import secrets; print(secrets.token_hex(32))"
    secret: "<GENERATED_SECRET>"
    users:
      # megha:
      #   password_hash: "<HASH_ME_WITH_HASH_PASSWORD>"
      #   display_name: "Megha"
      # james:
      #   password_hash: "<HASH_ME_WITH_HASH_PASSWORD>"
      #   display_name: "James"
